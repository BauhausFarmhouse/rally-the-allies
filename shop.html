<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rally the Allies - Souvenir Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400;700&family=Montserrat+Alternates:wght@300;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { overflow-x: hidden; }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #FFFFFF;
            margin: 0;
        }

        /* ── Nav ── */
        nav {
            position: fixed;
            top: 5%;
            left: 0;
            width: 100%;
            background-color: #7BC4C4;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            z-index: 1000;
            height: 60px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 2rem;
            flex: 1;
            justify-content: center;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: clamp(16px, 1.5vw, 24px);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: opacity 0.3s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-links a:hover { opacity: 0.8; }
        .nav-links a .heavy { font-weight: 700; }
        .nav-links a .light { font-weight: 300; }

        .nav-icon {
            display: inline-block;
            vertical-align: middle;
            stroke: white;
            margin: 0 0.3rem;
        }

        .nav-star {
            color: #FF6B4A;
            font-size: 45px;
            line-height: 1;
            -webkit-text-stroke: 3px white;
            text-stroke: 3px white;
            flex-shrink: 0;
        }

        .hamburger {
            display: flex;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            padding: 5px;
        }

        .hamburger span {
            width: 30px;
            height: 3px;
            background-color: white;
            border-radius: 2px;
        }

        @media (min-width: 768px) {
            nav { padding: 1.2rem 3rem; height: 70px; }
            .nav-star { font-size: 52px; }
        }

        @media (max-width: 767px) {
            nav { padding: 0.8rem 1rem; height: 50px; }
            .nav-links { gap: 1rem; }
            .nav-star { font-size: 37px; -webkit-text-stroke: 2px white; }
        }

        /* ── Logo ── */
        .logo-container {
            position: absolute;
            top: clamp(0px, 100px - 0.05 * 100vw, 100px);
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 0;
            z-index: 5;
        }

        .logo {
            width: 95%;
            max-width: 95%;
            height: auto;
            display: block;
        }

        /* ── Hero (identical to index.html) ── */
        .hero-section {
            position: relative;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 15%; /* desktop default */
        }

        @media (max-width: 1024px) {
            .hero-section { margin-top: 32%; }
        }

        @media (max-width: 767px) {
            .hero-section { margin-top: 28%; }
        }

        @media (max-width: 480px) {
            .hero-section { margin-top: 32%; }
        }

        .hero-container {
            position: relative;
            width: 95%;
            max-width: 95%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .hero-characters {
            width: 100%;
            height: auto;
            display: block;
            z-index: 10;
        }

        .hero-tagline {
            position: absolute;
            bottom: 5%;
            right: 2%;
            width: 63%;
            height: auto;
            z-index: 12;
        }

        /* ── Conveyor belt hero ── */
        .conveyor-belt {
            width: 100%;
            overflow: hidden;
            position: relative;
            z-index: 10;
            /* Full SVG height drives sizing. SVG is portrait 210x297.
               height 100% of its natural size, capped so it does not eat the screen. */
            height: clamp(200px, 60vw, 700px);
            -webkit-mask-image: linear-gradient(to right, transparent 0%, black 4%, black 96%, transparent 100%);
            mask-image: linear-gradient(to right, transparent 0%, black 4%, black 96%, transparent 100%);
        }

        .conveyor-track {
            display: flex;
            width: max-content;
            height: 100%;
            animation: conveyorScroll 80s linear infinite;
            will-change: transform;
        }

        /* Pause on hover so visitors can zoom in on details */
        .conveyor-belt:hover .conveyor-track {
            animation-play-state: paused;
        }

        .conveyor-frame {
            /* Height fills container, width auto-derives from 210x297 viewBox.
               Two frames side by side = seamless loop. No cropping, no offset. */
            flex-shrink: 0;
            height: 100%;
            width: auto;
            display: block;
        }

        @keyframes conveyorScroll {
            0%   { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* ── SOUVENIR SHOP sticky banner ── */
        .shop-banner-wrapper {
            position: -webkit-sticky;
            position: sticky;
            top: 120px;
            z-index: 999;
            background: transparent;
            margin-bottom: 0;
        }

        @media (max-width: 767px) {
            .shop-banner-wrapper { top: calc(5% + 50px); }
        }

        .shop-banner {
            width: 100%;
            height: 60px;
            display: block;
        }

        .shop-banner-wide   { display: block; }
        .shop-banner-tablet { display: none; }
        .shop-banner-mobile { display: none; }

        @media (max-width: 1024px) {
            .shop-banner-wide   { display: none; }
            .shop-banner-tablet { display: block; }
            .shop-banner-mobile { display: none; }
        }
        @media (max-width: 640px) {
            .shop-banner-wide   { display: none; }
            .shop-banner-tablet { display: none; }
            .shop-banner-mobile { display: block; }
        }

        /* ── Collections container ── */
        .collections-wrap {
            width: 100%;
        }

        /* ── Single collection stripe ── */
        .collection-stripe {
            width: 100%;
            padding: 3rem 0 6rem;
            position: relative;
        }

        .collection-stripe.stripe-blue       { background-color: #588e95; }
        .collection-stripe.stripe-white-blue { background-color: #ffffff; }
        .collection-stripe.stripe-white-red  { background-color: #ffffff; }
        .collection-stripe.stripe-red        { background-color: #e1502f; }

        /* ── Collection header row: logo left, title right ── */
        .collection-header {
            display: flex;
            align-items: center;
            gap: 2rem;
            padding: 0 4% 1.5rem;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* Placeholder logo */
        .collection-logo-placeholder {
            flex-shrink: 0;
            width: clamp(80px, 10vw, 140px);
            height: clamp(80px, 10vw, 140px);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
        }

        .stripe-blue       .collection-logo-placeholder { background-color: rgba(255,255,255,0.2); border: 2px dashed rgba(255,255,255,0.6); }
        .stripe-red        .collection-logo-placeholder { background-color: rgba(255,255,255,0.2); border: 2px dashed rgba(255,255,255,0.6); }
        .stripe-white-blue .collection-logo-placeholder { background-color: rgba(88,142,149,0.12); border: 2px dashed #588e95; }
        .stripe-white-red  .collection-logo-placeholder { background-color: rgba(225,80,47,0.12);  border: 2px dashed #e1502f; }

        .stripe-blue       .collection-logo-placeholder span { color: rgba(255,255,255,0.85); }
        .stripe-red        .collection-logo-placeholder span { color: rgba(255,255,255,0.85); }
        .stripe-white-blue .collection-logo-placeholder span { color: #588e95; }
        .stripe-white-red  .collection-logo-placeholder span { color: #e1502f; }

        .stripe-blue  .collection-title,
        .stripe-red   .collection-title { color: #ffffff; }
        .stripe-white-blue .collection-title { color: #588e95; }
        .stripe-white-red  .collection-title { color: #e1502f; }

        .stripe-blue  .collection-subtitle,
        .stripe-red   .collection-subtitle { color: rgba(255,255,255,0.85); }
        .stripe-white-blue .collection-subtitle,
        .stripe-white-red  .collection-subtitle { color: #555; }

        .stripe-blue       .product-dot { background-color: rgba(255,255,255,0.35); }
        .stripe-red        .product-dot { background-color: rgba(255,255,255,0.35); }
        .stripe-blue       .product-dot.active,
        .stripe-white-blue .product-dot.active { background-color: #588e95; }
        .stripe-red        .product-dot.active,
        .stripe-white-red  .product-dot.active { background-color: #e1502f; }

        .stripe-blue       .product-img-placeholder { background-color: rgba(255,255,255,0.2); color: #ffffff; }
        .stripe-red        .product-img-placeholder { background-color: rgba(255,255,255,0.2); color: #ffffff; }
        .stripe-white-blue .product-img-placeholder { background-color: rgba(88,142,149,0.1);  color: #588e95; }
        .stripe-white-red  .product-img-placeholder { background-color: rgba(225,80,47,0.1);   color: #e1502f; }

        .stripe-white-blue .product-card-btn { background-color: #588e95; }
        .stripe-white-red  .product-card-btn { background-color: #e1502f; }

        .stripe-blue       .shop-arrow { background-color: rgba(0,0,0,0.3); }
        .stripe-red        .shop-arrow { background-color: rgba(0,0,0,0.3); }
        .stripe-white-blue .shop-arrow { background-color: #588e95; }
        .stripe-white-red  .shop-arrow { background-color: #e1502f; }

        .collection-logo-placeholder span {
            font-family: 'DynaPuff', system-ui, sans-serif;
            font-size: clamp(18px, 3vw, 32px);
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 2px;
        }

        /* Collection title */
        .collection-title {
            font-family: 'DynaPuff', system-ui, sans-serif;
            font-size: clamp(22px, 3.5vw, 48px);
            font-weight: 700;
            line-height: 1.1;
        }

        .collection-subtitle {
            font-family: system-ui, sans-serif;
            font-size: clamp(13px, 1.4vw, 18px);
            color: #555;
            margin-top: 0.4rem;
            line-height: 1.4;
        }


        /* ── Collection logo images ── */
        .collection-logo-img {
            display: block;
            width: 100%;
            height: auto;
        }
        .collection-logo-desktop { display: block; }
        .collection-logo-mobile  { display: none; }

        @media (max-width: 767px) {
            .collection-logo-desktop { display: none; }
            .collection-logo-mobile  { display: block; }
        }

        /* Header takes full width when showing real logo */
        .collection-header-logo {
            width: 90%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 6% 1.5rem;
        }

        @media (max-width: 767px) {
            .collection-header-logo { padding-bottom: 2rem; }
        }

        /* ── Product carousel ── */
        .product-carousel-container {
            position: relative;
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 60px;
            overflow: visible;
        }

        .product-carousel {
            display: flex;
            gap: 1.5rem;
            overflow-x: auto;
            overflow-y: visible;
            scroll-behavior: smooth;
            scrollbar-width: none;
            -ms-overflow-style: none;
            padding-bottom: 1rem;
        }

        .product-carousel::-webkit-scrollbar { display: none; }

        /* ── Product card ── */
        .product-card {
            flex: 0 0 calc(25% - 1.2rem);
            min-width: calc(25% - 1.2rem);
            max-width: calc(25% - 1.2rem);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
            container-type: inline-size;
        }

        .product-card:hover { transform: scale(1.03); }

        /* Image area — 3:4 portrait for vertical product mockups */
        .product-card-image {
            width: 100%;
            aspect-ratio: 3 / 4;
            overflow: hidden;
            position: relative;
        }

        .product-card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Image placeholder for cards without images yet */
        .product-img-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'DynaPuff', system-ui, sans-serif;
            font-size: clamp(12px, 5cqi, 22px);
            font-weight: 700;
            color: #ffffff;
        }

        /* Card info area */
        .product-card-info {
            padding: 0.7rem 0.8rem 0;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .product-card-name {
            font-family: system-ui, -apple-system, sans-serif;
            font-size: clamp(13px, 4cqi, 17px);
            font-weight: 700;
            color: #222;
            line-height: 1.2;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* White text on solid-color stripes */
        .stripe-blue .product-card-name,
        .stripe-red  .product-card-name { color: #ffffff; }
        .stripe-blue .product-card-price,
        .stripe-red  .product-card-price { color: rgba(255,255,255,0.85); }

        .product-card-price {
            font-family: system-ui, sans-serif;
            font-size: clamp(12px, 3.5cqi, 16px);
            font-weight: 600;
            color: #555;
        }

        /* Shop button — contrasting color on solid stripes, theme color on white stripes */
        .product-card-btn {
            display: block;
            margin: 0.7rem 0.8rem 0.8rem;
            padding: 0.5rem 0;
            text-align: center;
            font-family: 'DynaPuff', system-ui, sans-serif;
            font-size: clamp(12px, 3.5cqi, 15px);
            font-weight: 700;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            transition: opacity 0.2s;
        }

        /* On blue stripe use darker blue, on red stripe use darker red */
        .stripe-blue .product-card-btn { background-color: #3d6e74; }
        .stripe-red  .product-card-btn { background-color: #b83d22; }

        .product-card-btn:hover { opacity: 0.82; }

        /* Carousel arrows */
        .shop-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0,0,0,0.3);
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            cursor: pointer;
            z-index: 10;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s;
        }

        .shop-arrow:hover { background-color: #333333; }
        .shop-arrow-left  { left: 0; }
        .shop-arrow-right { right: 0; }

        /* Carousel dots */
        .product-dots {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1.2rem;
        }

        .product-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: rgba(0,0,0,0.2);
            cursor: pointer;
            transition: background-color 0.3s;
            border: none;
            padding: 0;
        }

        /* Responsive card widths */
        @media (max-width: 1200px) {
            .product-card {
                flex: 0 0 calc(33.333% - 1rem);
                min-width: calc(33.333% - 1rem);
                max-width: calc(33.333% - 1rem);
            }
        }

        @media (max-width: 768px) {
            .product-card {
                flex: 0 0 calc(50% - 0.75rem);
                min-width: calc(50% - 0.75rem);
                max-width: calc(50% - 0.75rem);
            }
            .product-carousel-container { padding: 0 50px; }
            .shop-arrow { width: 40px; height: 40px; }
        }

        @media (max-width: 480px) {
            .product-card {
                flex: 0 0 80%;
                min-width: 80%;
                max-width: 80%;
            }
        }


        /* ── Collection description box ── */
        .collection-desc-wrap {
            position: relative;
            max-width: 1400px;
            margin: 2rem auto 0;
            padding: 0 4% 0 6%;
        }

        .collection-desc-box {
            position: relative;
            border-radius: 12px;
            padding: 1.4rem 1.8rem 1.4rem clamp(3rem, 14vw, 12rem);
            min-height: 80px;
        }

        /* Solid-color stripes: semi-transparent white box, white text */
        .stripe-blue .collection-desc-box {
            background-color: rgba(255,255,255,0.15);
            color: #ffffff;
        }
        .stripe-red .collection-desc-box {
            background-color: rgba(255,255,255,0.15);
            color: #ffffff;
        }

        /* White stripes: semi-transparent colored box, colored text */
        .stripe-white-blue .collection-desc-box {
            background-color: rgba(88,142,149,0.15);
            color: #588e95;
        }
        .stripe-white-red .collection-desc-box {
            background-color: rgba(225,80,47,0.15);
            color: #e1502f;
        }

        /* Star that pokes out to the left */
        .collection-desc-star {
            position: absolute;
            left: -2.2rem;
            top: -1.5rem;
            transform: rotate(-20deg);
            font-size: clamp(100px, 12vw, 180px);
            line-height: 1;
            -webkit-text-stroke: none;
        }

        .stripe-blue .collection-desc-star,
        .stripe-red  .collection-desc-star {
            color: #ffffff;
        }

        .stripe-white-blue .collection-desc-star {
            color: #588e95;
        }

        .stripe-white-red .collection-desc-star {
            color: #e1502f;
        }

        .collection-desc-text {
            font-family: system-ui, sans-serif;
            font-size: clamp(13px, 1.3vw, 17px);
            line-height: 1.6;
            /* inherits color from .collection-desc-box */
        }

        @media (max-width: 767px) {
            .collection-desc-wrap { padding: 0 4% 0 8%; }
            .collection-desc-star { font-size: clamp(100px, 12vw, 180px); left: -3rem; }
        }

        /* ── Divider stars between stripes ── */
        .stripe-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            padding: 0.6rem 0;
            background: #fff;
        }

        .stripe-divider span {
            font-size: 20px;
            opacity: 0.6;
        }

        .stripe-divider.divider-blue span { color: #588e95; }
        .stripe-divider.divider-red  span { color: #e1502f; }

    </style>
</head>
<body>

    <!-- Navigation -->
    <nav>
        <div class="nav-links">
            <a href="index.html#content">
                <span class="heavy">Content</span>
                <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
                <span class="light">Spaces</span>
            </a>
            <a href="index.html" style="text-decoration:none;"><span class="nav-star">★</span></a>
            <a href="shop.html">
                <span class="heavy">Souvenir</span>
                <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
                <span class="light">Shop</span>
            </a>
        </div>
        <div class="hamburger"><span></span><span></span><span></span></div>
    </nav>

    <!-- Logo -->
    <div class="logo-container">
        <img src="images/LAlogo.svg" alt="Rally the Allies Logo" class="logo">
    </div>

    <!-- Hero — conveyor belt scrolling ProductsPageHero.svg -->
    <div class="hero-section">
        <div class="conveyor-belt" aria-label="Souvenir shop characters on a conveyor belt">
            <div class="conveyor-track">
                <!-- Two identical copies so the loop is seamless -->
                <img src="images/ProductsPageHero.svg" alt="" class="conveyor-frame" draggable="false">
                <img src="images/ProductsPageHero.svg" alt="" class="conveyor-frame" draggable="false">
            </div>
        </div>
    </div>

    <!-- SOUVENIR SHOP sticky banner -->
    <div class="shop-banner-wrapper">
        <!-- Desktop -->
        <svg class="shop-banner shop-banner-wide" viewBox="0 0 1400 60" preserveAspectRatio="xMidYMid slice">
            <defs>
                <mask id="shopMaskWide">
                    <rect width="100%" height="100%" fill="white"/>
                    <text x="700" y="45" text-anchor="middle" font-size="40" font-weight="bold" font-family="'Montserrat Alternates', sans-serif" fill="black">SOUVENIR SHOP</text>
                    <text x="170"  y="42" text-anchor="middle" font-size="30" fill="black">★</text>
                    <text x="260"  y="42" text-anchor="middle" font-size="30" fill="black">★</text>
                    <text x="350"  y="42" text-anchor="middle" font-size="30" fill="black">★</text>
                    <text x="440"  y="42" text-anchor="middle" font-size="30" fill="black">★</text>
                    <text x="960"  y="42" text-anchor="middle" font-size="30" fill="black">★</text>
                    <text x="1050" y="42" text-anchor="middle" font-size="30" fill="black">★</text>
                    <text x="1140" y="42" text-anchor="middle" font-size="30" fill="black">★</text>
                    <text x="1230" y="42" text-anchor="middle" font-size="30" fill="black">★</text>
                </mask>
            </defs>
            <rect width="100%" height="100%" fill="#e1502f" mask="url(#shopMaskWide)"/>
        </svg>
        <!-- Tablet -->
        <svg class="shop-banner shop-banner-tablet" viewBox="0 0 1100 60" preserveAspectRatio="xMidYMid slice">
            <defs>
                <mask id="shopMaskTablet">
                    <rect width="100%" height="100%" fill="white"/>
                    <text x="550" y="45" text-anchor="middle" font-size="40" font-weight="bold" font-family="'Montserrat Alternates', sans-serif" fill="black">SOUVENIR SHOP</text>
                    <text x="120" y="42" text-anchor="middle" font-size="30" fill="black">★</text>
                    <text x="190" y="42" text-anchor="middle" font-size="30" fill="black">★</text>
                    <text x="260" y="42" text-anchor="middle" font-size="30" fill="black">★</text>
                    <text x="330" y="42" text-anchor="middle" font-size="30" fill="black">★</text>

    <script>
        // ── Sample product data ─────────────────────────────────────────────
        // Stripes order: blue, white, red, white, blue...
        // data-collection index matches array index below
        // white-stripe collections use data-collection="white-1" / "white-2" — handled separately
        const STRIPE_PRODUCTS = {
            0: [ // blue stripe 1
                { name: 'Product Name', price: '$24.99', image: null, url: '#' },
                { name: 'Product Name', price: '$32.00', image: null, url: '#' },
                { name: 'Product Name', price: '$18.50', image: null, url: '#' },
                { name: 'Product Name', price: '$45.00', image: null, url: '#' },
                { name: 'Product Name', price: '$22.00', image: null, url: '#' },
                { name: 'Product Name', price: '$29.99', image: null, url: '#' },
            ],
            'white-1': [ // white stripe 1
                { name: 'Product Name', price: '$19.99', image: null, url: '#' },
                { name: 'Product Name', price: '$36.00', image: null, url: '#' },
                { name: 'Product Name', price: '$27.50', image: null, url: '#' },
                { name: 'Product Name', price: '$15.00', image: null, url: '#' },
                { name: 'Product Name', price: '$42.00', image: null, url: '#' },
            ],
            1: [ // red stripe
                { name: 'Product Name', price: '$28.00', image: null, url: '#' },
                { name: 'Product Name', price: '$33.50', image: null, url: '#' },
                { name: 'Product Name', price: '$21.00', image: null, url: '#' },
                { name: 'Product Name', price: '$39.99', image: null, url: '#' },
                { name: 'Product Name', price: '$17.00', image: null, url: '#' },
            ],
            'white-2': [ // white stripe 2
                { name: 'Product Name', price: '$26.50', image: null, url: '#' },
                { name: 'Product Name', price: '$31.00', image: null, url: '#' },
                { name: 'Product Name', price: '$23.00', image: null, url: '#' },
                { name: 'Product Name', price: '$44.00', image: null, url: '#' },
            ],
            'white-3': [ // Draw Hot Dog white stripe
                { name: 'Product Name', price: '\$24.99', image: null, url: '#' },
                { name: 'Product Name', price: '\$32.00', image: null, url: '#' },
                { name: 'Product Name', price: '\$18.50', image: null, url: '#' },
                { name: 'Product Name', price: '\$45.00', image: null, url: '#' },
            ],
            2: [ // blue stripe 2
                { name: 'Product Name', price: '$19.00', image: null, url: '#' },
                { name: 'Product Name', price: '$37.50', image: null, url: '#' },
                { name: 'Product Name', price: '$25.00', image: null, url: '#' },
                { name: 'Product Name', price: '$16.00', image: null, url: '#' },
                { name: 'Product Name', price: '$48.00', image: null, url: '#' },
                { name: 'Product Name', price: '$30.00', image: null, url: '#' },
            ],
            3: [ // Blood on the Ice red stripe
                { name: 'Product Name', price: '$24.99', image: null, url: '#' },
                { name: 'Product Name', price: '$32.00', image: null, url: '#' },
                { name: 'Product Name', price: '$18.50', image: null, url: '#' },
                { name: 'Product Name', price: '$45.00', image: null, url: '#' },
            ],
        };

        // ── Build and wire each collection carousel ─────────────────────────
        document.querySelectorAll('.collection-stripe').forEach((stripe) => {
            const key  = stripe.dataset.collection;
            const data = STRIPE_PRODUCTS[key];
            if (!data || !data.length) return;

            const carousel = stripe.querySelector('.product-carousel');
            const dotsEl   = stripe.querySelector('.product-dots');
            const leftBtn  = stripe.querySelector('.shop-arrow-left');
            const rightBtn = stripe.querySelector('.shop-arrow-right');

            let currentIndex = 0;

            // Build cards
            data.forEach(p => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="product-card-image">
                        ${p.image
                            ? `<img src="${p.image}" alt="${p.name}">`
                            : `<div class="product-img-placeholder">IMAGE</div>`}
                    </div>
                    <div class="product-card-info">
                        <div class="product-card-name">${p.name}</div>
                        <div class="product-card-price">${p.price}</div>
                    </div>
                    <a href="${p.url}" class="product-card-btn">Shop Now</a>
                `;
                card.addEventListener('click', (e) => {
                    if (!e.target.classList.contains('product-card-btn')) {
                        window.location.href = p.url;
                    }
                });
                carousel.appendChild(card);
            });

            // Build dots
            const totalCards = data.length;
            for (let i = 0; i < totalCards; i++) {
                const dot = document.createElement('button');
                dot.className = 'product-dot' + (i === 0 ? ' active' : '');
                dot.addEventListener('click', () => scrollTo(i));
                dotsEl.appendChild(dot);
            }

            function getCardWidth() {
                const card = carousel.querySelector('.product-card');
                if (!card) return 0;
                const gap = parseFloat(getComputedStyle(carousel).gap) || 24;
                return card.offsetWidth + gap;
            }

            function scrollTo(index) {
                carousel.scrollTo({ left: getCardWidth() * index, behavior: 'smooth' });
                currentIndex = index;
                dotsEl.querySelectorAll('.product-dot').forEach((d, i) =>
                    d.classList.toggle('active', i === index));
            }

            leftBtn.addEventListener('click', () => {
                if (currentIndex > 0) scrollTo(currentIndex - 1);
            });

            rightBtn.addEventListener('click', () => {
                if (currentIndex < totalCards - 1) scrollTo(currentIndex + 1);
            });

            carousel.addEventListener('scroll', () => {
                const w = getCardWidth();
                if (!w) return;
                const newIdx = Math.round(carousel.scrollLeft / w);
                if (newIdx !== currentIndex) {
                    currentIndex = newIdx;
                    dotsEl.querySelectorAll('.product-dot').forEach((d, i) =>
                        d.classList.toggle('active', i === newIdx));
                }
            });
        });
    </script>
